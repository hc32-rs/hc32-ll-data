# HC32K118 系列外设实例（hc32-data-tools/csv_to_yaml.py 生成）。
# 地址来自 SVD；时钟门控来自设备头 FCG/PWC 位定义；
# MODE 拆分定时器（TIMx/ATIMx）用 views 挂 SVD 视图（同基址寄存器布局
# 叠影，工作模式由控制寄存器 MD 位运行时选择），地址/门控/中断在物理实例；
# 引脚复用（pins）暂缺，待从数据手册 GPIO 章节补齐。
- name: ADC
  address: 0x4000B800
  registers:
    kind: adc
    block: ADC
    version: ll_v1_3
  rcc:
    enable:
      register: FCG0
      field: CMU_FCG_ADC
  interrupts:
  - signal: ADC
    interrupt: ADC
