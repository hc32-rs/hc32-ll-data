# HC32M413 Flash 128K / SRAM 16K 的内存布局（型号：HC32M413FATI, HC32M413JATI, HC32M413KATI…）。
# 主 SRAM 16K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 16K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 128K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFFE000
  size: 16K
  access:
    read: true
    write: true
    execute: true
