# HC32F115 Flash 64K / SRAM 4K 的内存布局（型号：HC32F115F8TH, HC32F115H8TH…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 64K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 4K
  access:
    read: true
    write: true
    execute: true
