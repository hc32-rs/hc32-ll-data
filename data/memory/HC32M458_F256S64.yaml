# HC32M458 Flash 256K / SRAM 64K 的内存布局（型号：HC32M458KCTI…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 256K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFF8000
  size: 64K
  access:
    read: true
    write: true
    execute: true
