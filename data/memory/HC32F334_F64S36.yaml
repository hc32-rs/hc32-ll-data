# HC32F334 Flash 64K / SRAM 36K 的内存布局（型号：HC32F334F8UI, HC32F334J8TI, HC32F334J8UI, HC32F334K8TI…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 64K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFFC000
  size: 36K
  access:
    read: true
    write: true
    execute: true
