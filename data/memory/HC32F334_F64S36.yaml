# HC32F334 Flash 64K / SRAM 36K 的内存布局（型号：HC32F334F8UI, HC32F334J8TI, HC32F334J8UI, HC32F334K8TI…）。
# 主 SRAM 32K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 36K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 64K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFFC000
  size: 32K
  access:
    read: true
    write: true
    execute: true
- name: RAMB
  kind: ram
  address: 0x200F0000
  size: 4K
  access:
    read: true
    write: true
    execute: true
