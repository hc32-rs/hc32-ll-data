# HC32F175 Flash 512K / SRAM 48K 的内存布局（型号：HC32F175HETI, HC32F175JETI, HC32F175KETI, HC32F175PETI…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 512K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x20000000
  size: 48K
  access:
    read: true
    write: true
    execute: true
