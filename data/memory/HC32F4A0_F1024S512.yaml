# HC32F4A0 Flash 1024K / SRAM 512K 的内存布局（型号：HC32F4A0PGTB, HC32F4A0RGTB, HC32F4A0SGHB, HC32F4A0SGTB…）。
# 主 SRAM 512K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 512K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 1024K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFE0000
  size: 512K
  access:
    read: true
    write: true
    execute: true
- name: RAMB
  kind: ram
  address: 0x200F0000
  size: 4K
  access:
    read: true
    write: true
    execute: true
