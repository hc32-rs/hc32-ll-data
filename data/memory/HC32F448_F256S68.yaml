# HC32F448 Flash 256K / SRAM 68K 的内存布局（型号：HC32F448FCUI, HC32F448JCTI, HC32F448JCUI, HC32F448KCTI…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 256K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFF8000
  size: 68K
  access:
    read: true
    write: true
    execute: true
