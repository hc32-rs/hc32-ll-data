# HC32M441 Flash 128K / SRAM 32K 的内存布局（型号：HC32M441JATI, HC32M441KATI…）。
# 基址来自设备头/链接脚本（见 data/csv/memory.csv notes）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 128K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFF8000
  size: 32K
  access:
    read: true
    write: true
    execute: true
