# HC32A448 Flash 256K / SRAM 68K 的内存布局（型号：HC32A448JCTI, HC32A448KCTI, HC32A448MCTI…）。
# 主 SRAM 64K + 独立保留区来自 SDK 链接脚本/RM 内存映射表
#（见 data/csv/memory.csv sram_kb/extra_regions/notes）；DS 标称
# SRAM 68K 可能并入保留区（如 68K=主区 64K+RAMB 4K）。
memory:
- name: FLASH
  kind: flash
  address: 0x0
  size: 256K
  access:
    read: true
    write: true
    execute: true
- name: SRAM
  kind: ram
  address: 0x1FFF8000
  size: 64K
  access:
    read: true
    write: true
    execute: true
- name: RAMB
  kind: ram
  address: 0x200F0000
  size: 4K
  access:
    read: true
    write: true
    execute: true
